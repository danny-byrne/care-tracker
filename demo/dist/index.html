<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Kindred: a fictional care coordination demo by Danny Byrne. Explore a care overview, editable weekly calendar, and printable care plan.">
<meta name="theme-color" content="#253e35"><title>Kindred · A little more care</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%23253e35'/%3E%3Ctext x='10' y='29' fill='%23fff' font-size='30'%3E✳%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css"><script src="app.js" defer></script>
</head>
<body><a class="skip" href="#main">Skip to content</a><div id="app"></div><div id="toast" role="status" aria-live="polite"></div>
<dialog id="event-dialog" aria-labelledby="event-title"><form id="event-form"><div class="dialog-heading"><div><span class="eyebrow">MAKE ROOM FOR WHAT MATTERS</span><h2 id="event-title">Add an appointment</h2></div><button type="button" class="icon-button" data-close aria-label="Close appointment form">×</button></div><input type="hidden" name="id"><label>Appointment title<input name="title" required maxlength="80" placeholder="e.g. Afternoon physical therapy"></label><div class="form-row"><label>Date<input name="date" type="date" required></label><label>Time<input name="time" type="time" required></label></div><div class="form-row"><label>Duration<select name="duration"><option value="30">30 minutes</option><option value="60">1 hour</option><option value="90">1½ hours</option></select></label><label>Category<select name="category"><option value="appointment">Appointment</option><option value="activity">Activity</option><option value="medication">Medication reminder</option></select></label></div><label>Location<input name="location" maxlength="100" placeholder="e.g. Home or Willow Clinic"></label><label>Care partner<select name="partner"><option>Alex Morgan</option><option>Jamie Morgan</option><option>Robin Chen</option></select></label><label>Notes<textarea name="notes" rows="2" maxlength="400" placeholder="Anything the care circle should know?"></textarea></label><p class="form-note">Fictional demo only. Changes stay in this browser.</p><div class="dialog-actions"><button type="button" id="delete-event" class="danger">Delete appointment</button><button type="button" data-close class="button secondary">Cancel</button><button type="submit" class="button primary">Save appointment</button></div></form></dialog>
<dialog id="reset-dialog" aria-labelledby="reset-title"><h2 id="reset-title">A fresh start?</h2><p>This restores the fictional schedule and clears your check-offs and appointment edits in this browser.</p><div class="dialog-actions"><button class="button secondary" data-close>Keep my changes</button><button class="button primary" id="confirm-reset">Reset demo</button></div></dialog>
</body></html>
